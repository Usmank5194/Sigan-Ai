<style>
:root { --bg: #0f0f0f; --surface: #1e1e1e; --surface-hover: #2d2d2d; --text: #f3f4f6; --text-muted: #9ca3af; --primary: #3b82f6; --border: #333333; --danger: #ef4444; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; outline: none; border: none; background: none; color: inherit; }
.app { display: flex; height: 100vh; height: 100dvh; position: relative; flex-direction: column; }
.header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top)); background: var(--bg); z-index: 10; }
.header-title { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; color: var(--text-muted); }
.icon-btn:hover { background: var(--surface); color: var(--text); }
.icon-btn svg { width: 22px; height: 22px; }
.chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; scroll-behavior: smooth; }
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.welcome { margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.welcome-logo { font-size: 48px; margin-bottom: 8px; }
.welcome h2 { font-size: 24px; font-weight: 500; color: var(--text); }
.welcome p { font-size: 14px; color: var(--text-muted); max-width: 280px; line-height: 1.5; }
.messages { width: 100%; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; padding-bottom: 20px; }
.messages:empty { display: none; }
.msg { display: flex; flex-direction: column; max-width: 100%; animation: fadeUp 0.3s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-items: flex-end; }
.msg.user .bubble { background: var(--surface); padding: 12px 18px; border-radius: 20px; border-bottom-right-radius: 4px; font-size: 15px; line-height: 1.5; max-width: 85%; word-wrap: break-word; }
.msg.model { align-items: flex-start; }

.msg.error .bubble { color: var(--danger); background: rgba(239, 68, 68, 0.1); padding: 12px; border-radius: 12px; font-size: 14px; }
.bubble h1, .bubble h2, .bubble h3 { margin: 16px 0 8px; font-weight: 600; color: #fff; }
.bubble p { margin-bottom: 12px; }
.bubble ul, .bubble ol { margin-bottom: 12px; padding-left: 24px; }
.bubble li { margin-bottom: 6px; }
.bubble strong { font-weight: 600; color: #fff; }
.bubble code { background: #2d2d2d; padding: 2px 6px; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 13px; color: #a78bfa; }
.bubble table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
.bubble th, .bubble td { border: 1px solid var(--border); padding: 8px; text-align: left; }

.bubble pre code { background: none; padding: 0; color: inherit; font-family: ui-monospace, monospace; }
.copy-btn { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.1); color: #ccc; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; transition: 0.2s; }
.copy-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
.copy-btn.copied { background: #10b981; color: #fff; }
.action-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }

.chat-item { padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; cursor: pointer; }
.chat-item:hover { background: var(--surface-hover); }

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<script>
/* ============================================================
   SIGAN AI v19.1 - Bugfix UI & Restored Buttons
   ============================================================ */

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

const LS_CHATS = 'sigan_chats_v4';
const LS_PROVIDER = 'sigan_provider';
const LS_TAVILY = 'sigan_tavily_key';
const MAX_MEMORY_MESSAGES = 10; 

const SYSTEM_PROMPT = `Anda adalah "Sigan Ai", asisten AI cerdas serba bisa. Karakter: Ramah, cerdas, dan profesional. 
PENTING: Jika pengguna memberikan "Konteks Pencarian Web", gunakan informasi tersebut sebagai sumber kebenaran utama untuk menjawab. Abaikan memori internal Anda jika bertentangan dengan hasil pencarian web. Sebutkan sumber/referensinya dengan jelas.`;

const state = { chats: [], activeId: null, sending: false, imageBase64: null, fileText: null, fileName: null, provider: 'groq', searchMode: false };
let callState = { active: false, timer: null, seconds: 0, isSpeaking: false, isProcessing: false };

const els = {};
['chatArea','messages','welcome','userInput','sendBtn','menuBtn','newChatBtnHeader','closeSidebar','sidebar','sidebarOverlay','chatList','settingsBtn','settingsModal','closeSettings','providerSelect','apiKeyLabel','apiKeyInput','tavilyKeyInput','modelLabel','modelSelect','saveSettings','toast','chips','imageUpload','cameraBtn','fileBtn','searchBtn','fileUpload', 'callBtnHeader','voiceOverlay','voiceOrb','voiceStatus','callTimer','endCallBtn'].forEach(id => els[id] = document.getElementById(id));

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const escapeHtml = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* --- MARKDOWN --- */
function renderMarkdown(text) {
  let s = escapeHtml(text);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => `<div class="code-container"><button class="copy-btn" onclick="copyCode(this)">Salin</button><pre><code>${code.replace(/\n$/, '')}</code></pre></div>`);
  s = s.replace(/((?:\|.*\|(?:\r?\n|$))+)/g, (match) => {
    const lines = match.trim().split('\n');
    if (lines.length < 2 || !lines[0].includes('-')) return match;
    let table = '<table>'; let isHeader = true;
    for (const line of lines) {
      if (line.includes('---')) { isHeader = false; continue; }
      const cells = line.split('|').filter((c, i, arr) => i > 0 && i < arr.length - 1);
      table += '<tr>';
      for (const cell of cells) table += isHeader ? `<th>${cell.trim()}</th>` : `<td>${cell.trim()}</td>`;
      table += '</tr>'; isHeader = false;
    }
    table += '</table>'; return table;
  });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>');
  const lines = s.split('\n'); let inList = false, out = [];
  for (const line of lines) {
    const m = line.match(/^\s*[-*]\s+(.+)$/);
    if (m) { if (!inList) { out.push('<ul>'); inList = true; } out.push(`<li>${m[1]}</li>`); }
    else { if (inList) { out.push('</ul>'); inList = false; } out.push(line); }
  }
  if (inList) out.push('</ul>');
  s = out.join('\n').replace(/\n/g, '<br>').replace(/<br>\s*<ul>/g, '<ul>').replace(/<\/ul>\s*<br>/g, '</ul>').replace(/<br>\s*<li>/g, '<li>').replace(/<\/li>\s*<br>/g, '</li>');
  return s;
}
window.copyCode = function(btn) { navigator.clipboard.writeText(btn.nextElementSibling.innerText); btn.textContent = 'Tersalin!'; setTimeout(() => btn.textContent = 'Salin', 2000); };
function showToast(msg, type = '') { els.toast.textContent = msg; els.toast.className = `toast show ${type}`; setTimeout(() => els.toast.classList.remove('show'), 3000); }

/* --- CHAT CORE --- */
function loadChats() { try { state.chats = JSON.parse(localStorage.getItem(LS_CHATS)) || []; } catch { state.chats = []; } }
function saveChats() { localStorage.setItem(LS_CHATS, JSON.stringify(state.chats)); }
function getActiveChat() { return state.chats.find(c => c.id === state.activeId); }
function renderChatList() {
  if (!state.chats.length) { els.chatList.innerHTML = '<div style="color:#666;text-align:center;padding:20px;font-size:13px;">Belum ada chat.</div>'; return; }
  els.chatList.innerHTML = state.chats.map(c => `
    <div class="chat-item ${c.id === state.activeId ? 'active' : ''}" onclick="selectChat('${c.id}')">
      <div class="chat-item-title">${escapeHtml(c.title || 'Chat Baru')}</div>
      <button class="del-btn" onclick="event.stopPropagation(); deleteChat('${c.id}')">🗑</button>
    </div>`).join('');
}
window.selectChat = (id) => { state.activeId = id; renderChatList(); renderMessages(); closeSidebar(); };
window.deleteChat = (id) => { if(!confirm('Hapus chat ini?')) return; state.chats = state.chats.filter(c => c.id !== id); if (state.activeId === id) state.activeId = state.chats[0]?.id || null; saveChats(); renderChatList(); renderMessages(); };
function createNewChat() { const chat = { id: uid(), title: 'Chat Baru', messages: [], updatedAt: Date.now() }; state.chats.unshift(chat); state.activeId = chat.id; saveChats(); renderChatList(); renderMessages(); closeSidebar(); }

function renderMessages() {
  const chat = getActiveChat();
  if (!chat || !chat.messages.length) { els.welcome.style.display = 'flex'; els.messages.innerHTML = ''; return; }
  els.welcome.style.display = 'none';
  els.messages.innerHTML = chat.messages.map((m) => {
    if (m.role === 'user') {
      let attachHtml = '';
      if (m.image) attachHtml += `<img src="${m.image}" style="max-width:200px;border-radius:12px;margin-bottom:8px;">`;
      if (m.fileName) attachHtml += `<div class="attachment-preview">📎 ${escapeHtml(m.fileName)}</div>`;
      return `<div class="msg user">${attachHtml}<div class="bubble">${escapeHtml(m.displayText || m.text)}</div></div>`;
    }
    if (m.role === 'error') return `<div class="msg model error"><div class="bubble">⚠️ ${escapeHtml(m.text)}</div></div>`;
    return `<div class="msg model"><div class="bubble">${renderMarkdown(m.text)}
      <div class="action-toolbar">
        <button class="dl-btn" onclick="downloadPDF(this)">📄 PDF</button>
        <button class="dl-btn" onclick="downloadWord(this)">📝 Word</button>
        <button class="dl-btn" onclick="downloadExcel(this)">📊 Excel</button>
        <button class="dl-btn" onclick="downloadPPT('${encodeURIComponent(m.text)}')">📽️ PPT</button>
      </div>
    </div></div>`;
  }).join('');
  els.chatArea.scrollTop = els.chatArea.scrollHeight;
}

/* --- DOWNLOAD --- */
window.downloadPDF = function(btn) { const bubble = btn.closest('.bubble'); btn.closest('.action-toolbar').style.display = 'none'; const opt = { margin: 10, filename: 'SiganAI.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } }; const clone = bubble.cloneNode(true); clone.style.color = '#000'; clone.style.background = '#fff'; html2pdf().set(opt).from(clone).save().then(() => { btn.closest('.action-toolbar').style.display = 'flex'; }); };
window.downloadWord = function(btn) { const bubble = btn.closest('.bubble'); const clone = bubble.cloneNode(true); clone.querySelector('.action-toolbar').remove(); const blob = htmlDocx.asBlob(`<html><body>${clone.innerHTML}</body></html>`); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'SiganAI.docx'; a.click(); };
window.downloadExcel = function(btn) { const table = btn.closest('.bubble').querySelector('table'); if (!table) { showToast('Tidak ada tabel.', 'error'); return; } const wb = XLSX.utils.table_to_book(table); XLSX.writeFile(wb, 'SiganAI.xlsx'); };
window.downloadPPT = function(encodedText) { const text = decodeURIComponent(encodedText); let pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_16x9'; const slides = text.split(/\n\s*---\s*\n/); slides.forEach((slideText) => { let lines = slideText.trim().split('\n').filter(l => l.trim()); if (lines.length === 0) return; let slide = pptx.addSlide(); let title = ""; let bullets = []; lines.forEach(line => { if (line.startsWith('#')) title = line.replace(/#/g, '').trim(); else if (line.startsWith('-') || line.startsWith('*')) bullets.push({ text: line.replace(/^[-*]\s*/, '').trim(), options: { bullet: true } }); else { if (!title) title = line.trim(); else bullets.push({ text: line.trim(), options: { bullet: false } }); } }); slide.background = { color: "0F0F0F" }; slide.addText(title || "Slide", { x: 0.5, y: 0.5, w: '90%', h: 1, fontSize: 28, bold: true, color: "3b82f6" }); if (bullets.length > 0) slide.addText(bullets, { x: 0.5, y: 1.5, w: '90%', h: 4, fontSize: 18, color: "E5E5E5" }); }); pptx.writeFile({ fileName: "SiganAI.pptx" }); };

/* --- SMART WEB SEARCH --- */
async function performWebSearch(query) {
  const tavilyKey = localStorage.getItem(LS_TAVILY);
  if (!tavilyKey) {
    showToast('API Key Tavily belum diatur di Pengaturan.', 'error');
    return null;
  }

  try {
    const response = await fetch('https://api.tavily.com/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        api_key: tavilyKey,
        query: query,
        search_depth: "basic",
        include_answer: true,
        max_results: 3
      })
    });

    const data = await response.json();
    let context = "";
    if (data.answer) context += `[RINGKASAN PENCARIAN]:\n${data.answer}\n\n`;
    if (data.results && data.results.length > 0) {
      context += data.results.map((r, i) => {
        const snippet = r.content.substring(0, 500);
        return `[Referensi ${i+1}] ${r.title}\nURL: ${r.url}\nCuplikan: ${snippet}...\n`;
      }).join('\n');
    }
    return context;
  } catch (e) {
    console.warn("Pencarian gagal:", e);
    return null;
  }
}

/* --- API FETCH LOGIC --- */
async function fetchWithRetry(url, options) {
  for (let i=0; i<3; i++) {
    const res = await fetch(url, options);
    if (res.status === 429) { await new Promise(r => setTimeout(r, 2000)); continue; }
    if (!res.ok) { let errMsg = 'Gagal terhubung ke API'; try { const err = await res.json(); errMsg = err.error?.message || errMsg; } catch(e){} throw new Error(errMsg); }
    return res;
  }
  throw new Error('Kuota API habis.');
}

async function callOpenAICompatibleStreaming(url, apiKey, model, messages, onChunk) {
  const recentMessages = messages.slice(-MAX_MEMORY_MESSAGES);
  const chatMessages = [{ role: 'system', content: SYSTEM_PROMPT }, ...recentMessages.map(m => ({ role: m.role === 'model' ? 'assistant' : 'user', content: m.text }))];
  const headers = { 'Content-Type': 'application/json' };
  if (apiKey) headers['Authorization'] = `Bearer ${apiKey}`;
  const response = await fetchWithRetry(url, { method: 'POST', headers: headers, body: JSON.stringify({ model, messages: chatMessages, stream: true }) });
  const reader = response.body.getReader(); const decoder = new TextDecoder("utf-8"); let fullText = "";
  while (true) { const { done, value } = await reader.read(); if (done) break; const chunk = decoder.decode(value, { stream: true }); for (const line of chunk.split("\n")) { if (line.startsWith("data: ")) { const dataStr = line.slice(6); if (dataStr === "[DONE]") break; try { const data = JSON.parse(dataStr); const text = data.choices?.[0]?.delta?.content || ""; if (text) { fullText += text; onChunk(fullText); } } catch (e) {} } } }
  return fullText;
}

async function callGeminiStreaming(messages, onChunk) {
  const apiKey = localStorage.getItem('sigan_gemini_key'); const model = localStorage.getItem('sigan_gemini_model') || 'gemini-flash-latest';
  const recentMessages = messages.slice(-MAX_MEMORY_MESSAGES);
  const contents = recentMessages.map(m => { const parts = [{ text: m.text }]; if (m.image) parts.push({ inlineData: { mimeType: "image/jpeg", data: m.image.split(',')[1] } }); return { role: m.role === 'model' ? 'model' : 'user', parts }; });
  const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents, systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] } }) });
  const reader = response.body.getReader(); const decoder = new TextDecoder("utf-8"); let fullText = "";
  while (true) { const { done, value } = await reader.read(); if (done) break; const chunk = decoder.decode(value, { stream: true }); for (const line of chunk.split("\n")) { if (line.startsWith("data: ")) { const dataStr = line.slice(6); if (dataStr === "[DONE]") break; try { const data = JSON.parse(dataStr); const text = data.candidates?.[0]?.content?.parts?.[0]?.text || ""; if (text) { fullText += text; onChunk(fullText); } } catch (e) {} } } }
  return fullText;
}

async function callAIStreaming(messages, onChunk) {
  if (state.provider === 'gemini') return callGeminiStreaming(messages, onChunk);
  if (state.provider === 'groq') return callOpenAICompatibleStreaming('https://api.groq.com/openai/v1/chat/completions', localStorage.getItem('sigan_groq_key'), localStorage.getItem('sigan_groq_model') || 'openai/gpt-oss-120b', messages, onChunk);
  if (state.provider === 'llm7') return callOpenAICompatibleStreaming('https://api.llm7.io/v1/chat/completions', localStorage.getItem('sigan_llm7_key'), localStorage.getItem('sigan_llm7_model') || 'default', messages, onChunk);
  if (state.provider === 'nvidia') return callOpenAICompatibleStreaming('https://integrate.api.nvidia.com/v1/chat/completions', localStorage.getItem('sigan_nvidia_key'), localStorage.getItem('sigan_nvidia_model') || 'deepseek-ai/deepseek-v4.1-flash', messages, onChunk);
}

/* --- VOICE CALL API --- */
async function callAITextVoice(userText) {
  if (state.provider === 'gemini') {
    const apiKey = localStorage.getItem('sigan_gemini_key'); const model = localStorage.getItem('sigan_gemini_model') || 'gemini-flash-latest';
    const response = await fetchWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: userText }] }], systemInstruction: { parts: [{ text: "Jawab maksimal 2 kalimat." }] }, generationConfig: { maxOutputTokens: 100 } }) });
    const data = await response.json(); return data.candidates?.[0]?.content?.parts?.[0]?.text || "Oke.";
  } else {
    let url, key, model;
    if (state.provider === 'groq') { url = 'https://api.groq.com/openai/v1/chat/completions'; key = localStorage.getItem('sigan_groq_key'); model = localStorage.getItem('sigan_groq_model') || 'openai/gpt-oss-120b'; }
    else if (state.provider === 'llm7') { url = 'https://api.llm7.io/v1/chat/completions'; key = localStorage.getItem('sigan_llm7_key'); model = localStorage.getItem('sigan_llm7_model') || 'default'; }
    else if (state.provider === 'nvidia') { url = 'https://integrate.api.nvidia.com/v1/chat/completions'; key = localStorage.getItem('sigan_nvidia_key'); model = localStorage.getItem('sigan_nvidia_model') || 'deepseek-ai/deepseek-v4.1-flash'; }
    const headers = { 'Content-Type': 'application/json' }; if (key) headers['Authorization'] = `Bearer ${key}`;
    const response = await fetchWithRetry(url, { method: 'POST', headers: headers, body: JSON.stringify({ model, messages: [{ role: 'system', content: "Jawab maksimal 2 kalimat." }, { role: 'user', content: userText }], max_tokens: 100 }) });
    const data = await response.json(); return data.choices?.[0]?.message?.content || "Oke.";
  }
}

/* --- SEND MESSAGE --- */
async function sendMessage() {
  const text = els.userInput.value.trim();
  if ((!text && !state.imageBase64 && !state.fileText) || state.sending) return;
  if (!state.activeId) createNewChat();
  const chat = getActiveChat();
  
  let finalPrompt = text;
  
  if (state.searchMode && text) {
    showToast('Mencari referensi web...', '');
    const searchContext = await performWebSearch(text);
    if (searchContext) {
      finalPrompt = `[KONTEKS PENCARIAN WEB]:\n${searchContext}\n\nBerdasarkan referensi di atas, jawablah: ${text}`;
      showToast('Referensi ditemukan!', 'success');
    } else {
      showToast('Gagal mencari, pakai memori AI.', 'error');
    }
  }

  if (state.fileText) {
    finalPrompt += `\n\n--- ISI DOKUMEN (${state.fileName}) ---\n${state.fileText}\n-----------------------------------`;
    state.fileText = null; state.fileName = null;
  }

  chat.messages.push({ role: 'user', text: finalPrompt, image: state.imageBase64, displayText: text });
  if (chat.title === 'Chat Baru' && text) chat.title = text.slice(0, 30) + '...';
  saveChats();
  
  els.userInput.value = ''; els.userInput.style.height = 'auto'; state.imageBase64 = null; 
  els.imageUpload.value = ''; els.fileUpload.value = '';
  els.sendBtn.disabled = true; renderMessages(); renderChatList();
  
  state.sending = true; els.welcome.style.display = 'none';
  els.messages.innerHTML += `<div class="msg model" id="thinking-indicator"><div class="bubble typing"><span></span><span></span><span></span></div></div>`;
  els.chatArea.scrollTop = els.chatArea.scrollHeight;

  try {
    let fullReply = "";
    await callAIStreaming(chat.messages, (currentText) => {
      fullReply = currentText;
      const indicator = document.getElementById('thinking-indicator'); if (indicator) indicator.remove();
      let replyBubble = document.getElementById('streaming-bubble');
      if (!replyBubble) { els.messages.innerHTML += `<div class="msg model" id="streaming-bubble"><div class="bubble"></div></div>`; replyBubble = document.getElementById('streaming-bubble'); }
      replyBubble.querySelector('.bubble').innerHTML = renderMarkdown(currentText); els.chatArea.scrollTop = els.chatArea.scrollHeight;
    });
    chat.messages.push({ role: 'model', text: fullReply, ts: Date.now() });
  } catch (e) {
    const indicator = document.getElementById('thinking-indicator'); if (indicator) indicator.remove();
    chat.messages.push({ role: 'error', text: e.message, ts: Date.now() });
  } finally {
    state.sending = false; saveChats(); renderMessages(); updateSendBtn();
    state.searchMode = false; if(els.searchBtn) els.searchBtn.classList.remove('active'); 
  }
}
function updateSendBtn() { els.sendBtn.disabled = (!els.userInput.value.trim() && !state.imageBase64 && !state.fileText) || state.sending; }

/* --- VOICE LOGIC --- */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition; let synth = window.speechSynthesis;
if (SpeechRecognition) {
  recognition = new SpeechRecognition(); recognition.lang = 'id-ID'; recognition.interimResults = false;
  recognition.onstart = () => { if (!callState.active || callState.isSpeaking) return; els.voiceOrb.className = 'orb listening'; els.voiceStatus.textContent = 'Mendengarkan...'; };
  recognition.onresult = async (e) => {
    if (callState.isSpeaking || callState.isProcessing) return;
    const transcript = e.results[0][0].transcript; if (!transcript || transcript.trim().length < 2) return; 
    callState.isProcessing = true; els.voiceOrb.className = 'orb'; els.voiceStatus.textContent = 'Memproses...'; recognition.abort();
    try { const reply = await callAITextVoice(transcript); speakText(reply); } catch (err) { els.voiceStatus.textContent = 'Error.'; callState.isProcessing = false; setTimeout(() => { if(callState.active) startListening(); }, 2000); }
  };
  recognition.onend = () => { if (callState.active && !callState.isSpeaking && !callState.isProcessing) { setTimeout(() => { if(callState.active) startListening(); }, 300); } };
}
function speakText(text) {
  if (!callState.active) return; synth.cancel(); if(recognition) recognition.abort(); 
  const utterance = new SpeechSynthesisUtterance(text.replace(/[*#_`~]/g, '')); utterance.lang = 'id-ID'; utterance.rate = 1.05;
  utterance.onstart = () => { callState.isSpeaking = true; els.voiceOrb.className = 'orb speaking'; els.voiceStatus.textContent = 'Berbicara...'; };
  utterance.onend = () => { callState.isSpeaking = false; callState.isProcessing = false; setTimeout(() => { if (callState.active && !callState.isSpeaking) startListening(); }, 500); };
  synth.speak(utterance);
}
function startListening() { if (!callState.active || callState.isSpeaking || callState.isProcessing) return; try { recognition.start(); } catch (e) {} }
function startCall() { if (!SpeechRecognition || !synth) { showToast('Browser tidak mendukung suara.', 'error'); return; } els.voiceOverlay.classList.add('active'); callState.active = true; callState.seconds = 0; callState.isSpeaking = false; callState.isProcessing = false; els.voiceStatus.textContent = 'Menyambungkan...'; els.voiceOrb.className = 'orb'; clearInterval(callState.timer); callState.timer = setInterval(() => { callState.seconds++; const m = String(Math.floor(callState.seconds / 60)).padStart(2, '0'); const s = String(callState.seconds % 60).padStart(2, '0'); els.callTimer.textContent = `${m}:${s}`; }, 1000); setTimeout(() => { speakText("Halo, ada yang bisa saya bantu?"); }, 500); }
function endCall() { callState.active = false; clearInterval(callState.timer); synth.cancel(); if(recognition) recognition.abort(); els.voiceOverlay.classList.remove('active'); els.callTimer.textContent = '00:00'; }

/* --- EVENTS --- */
els.sendBtn.onclick = sendMessage;
els.userInput.oninput = () => { els.userInput.style.height = 'auto'; els.userInput.style.height = (els.userInput.scrollHeight) + 'px'; updateSendBtn(); };
els.userInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
els.callBtnHeader.onclick = startCall; els.endCallBtn.onclick = endCall; els.newChatBtnHeader.onclick = createNewChat;
els.menuBtn.onclick = () => { els.sidebar.classList.add('open'); els.sidebarOverlay.classList.add('show'); };
window.closeSidebar = () => { els.sidebar.classList.remove('open'); els.sidebarOverlay.classList.remove('show'); };
els.closeSidebar.onclick = closeSidebar; els.sidebarOverlay.onclick = closeSidebar;

els.chips.onclick = (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  els.userInput.value = chip.dataset.prompt;
  els.userInput.focus();
  
  if (chip.dataset.search === "true") {
    state.searchMode = true;
    if(els.searchBtn) els.searchBtn.classList.add('active');
    sendMessage();
  } else {
    updateSendBtn();
    els.userInput.setSelectionRange(els.userInput.value.length, els.userInput.value.length);
    els.userInput.style.height = 'auto'; els.userInput.style.height = (els.userInput.scrollHeight) + 'px';
  }
};

els.searchBtn.onclick = () => {
  state.searchMode = !state.searchMode;
  if (state.searchMode) {
    els.searchBtn.classList.add('active');
    showToast('Mode Pencarian Web AKTIF', 'success');
  } else {
    els.searchBtn.classList.remove('active');
    showToast('Mode Pencarian Web MATI', '');
  }
};

els.cameraBtn.onclick = () => els.imageUpload.click();
els.imageUpload.onchange = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { state.imageBase64 = ev.target.result; updateSendBtn(); showToast('Foto siap dikirim.', 'success'); if (!els.userInput.value) els.userInput.value = "Tolong analisis gambar ini."; }; reader.readAsDataURL(file); };

els.fileBtn.onclick = () => els.fileUpload.click();
els.fileUpload.onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return; showToast('Membaca file...', '');
  try {
    let extractedText = "";
    if (file.name.endsWith('.pdf')) {
      const arrayBuffer = await file.arrayBuffer(); const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
      for (let i = 1; i <= pdf.numPages; i++) { const page = await pdf.getPage(i); const content = await page.getTextContent(); extractedText += content.items.map(item => item.str).join(" ") + "\n"; }
    } else if (file.name.endsWith('.docx')) {
      const arrayBuffer = await file.arrayBuffer(); const result = await mammoth.extractRawText({ arrayBuffer }); extractedText = result.value;
    } else { extractedText = await file.text(); }
    if (!extractedText || extractedText.trim() === "") throw new Error("Dokumen tidak memiliki teks (mungkin hasil scan).");
    state.fileText = extractedText; state.fileName = file.name; updateSendBtn(); showToast('File berhasil dibaca.', 'success');
    if (!els.userInput.value) els.userInput.value = "Tolong rangkum dokumen ini.";
  } catch (err) { showToast(err.message, 'error'); els.fileUpload.value = ''; }
};

els.settingsBtn.onclick = openSettings; els.closeSettings.onclick = () => els.settingsModal.classList.remove('show');

/* --- INIT --- */
state.provider = localStorage.getItem(LS_PROVIDER) || 'groq';
loadChats();
if (state.chats.length > 0) { state.activeId = state.chats[0].id; renderMessages(); }
renderChatList();
updateSendBtn();
</script>
