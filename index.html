<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sigan Ai - Multi AI</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1e1e1e;
  --surface-hover: #2d2d2d;
  --text: #f3f4f6;
  --text-muted: #9ca3af;
  --primary: #3b82f6;
  --border: #333333;
  --danger: #ef4444;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; outline: none; border: none; background: none; color: inherit; }

.app { display: flex; height: 100vh; height: 100dvh; position: relative; flex-direction: column; }

/* HEADER */
.header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top)); background: var(--bg); z-index: 10; }
.header-title { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; color: var(--text-muted); }
.icon-btn:hover { background: var(--surface); color: var(--text); }
.icon-btn svg { width: 22px; height: 22px; }

/* CHAT AREA */
.chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; scroll-behavior: smooth; }
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.welcome { margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.welcome-logo { font-size: 48px; margin-bottom: 8px; }
.welcome h2 { font-size: 24px; font-weight: 500; color: var(--text); }
.welcome p { font-size: 14px; color: var(--text-muted); max-width: 280px; line-height: 1.5; }

/* MESSAGES */
.messages { width: 100%; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; padding-bottom: 20px; }
.messages:empty { display: none; }
.msg { display: flex; flex-direction: column; max-width: 100%; animation: fadeUp 0.3s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-items: flex-end; }
.msg.user .bubble { background: var(--surface); padding: 12px 18px; border-radius: 20px; border-bottom-right-radius: 4px; font-size: 15px; line-height: 1.5; max-width: 85%; word-wrap: break-word; }
.msg.model { align-items: flex-start; }
.msg.model .bubble { width: 100%; font-size: 15px; line-height: 1.6; word-wrap: break-word; color: #e5e5e5; position: relative; }
.msg.error .bubble { color: var(--danger); background: rgba(239, 68, 68, 0.1); padding: 12px; border-radius: 12px; font-size: 14px; }

/* MARKDOWN STYLES */
.bubble h1, .bubble h2, .bubble h3 { margin: 16px 0 8px; font-weight: 600; color: #fff; }
.bubble p { margin-bottom: 12px; }
.bubble ul, .bubble ol { margin-bottom: 12px; padding-left: 24px; }
.bubble li { margin-bottom: 6px; }
.bubble strong { font-weight: 600; color: #fff; }
.bubble code { background: #2d2d2d; padding: 2px 6px; border-radius: 6px; font-family: ui-monospace, monospace; font-size: 13px; color: #a78bfa; }
.code-container { position: relative; margin: 16px 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
.bubble pre { background: #000; padding: 16px; overflow-x: auto; font-size: 13px; line-height: 1.5; color: #e5e5e5; }
.bubble pre code { background: none; padding: 0; color: inherit; font-family: ui-monospace, monospace; }
.copy-btn { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.1); color: #ccc; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; transition: 0.2s; }
.copy-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }
.copy-btn.copied { background: #10b981; color: #fff; }

/* LOADING DOTS */
.typing { display: flex; gap: 4px; padding: 8px 0; }
.typing span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: blink 1.4s infinite both; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

/* INPUT AREA & CHIPS */
.input-wrapper { padding: 10px 20px 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; flex-direction: column; align-items: center; }
.chips-container { width: 100%; max-width: 800px; display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; scrollbar-width: none; }
.chips-container::-webkit-scrollbar { display: none; }
.chip { white-space: nowrap; padding: 8px 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; transition: 0.2s; }
.chip:hover { background: var(--surface-hover); color: var(--text); }
.input-box { width: 100%; max-width: 800px; background: var(--surface); border-radius: 24px; display: flex; align-items: flex-end; padding: 8px 12px; border: 1px solid var(--border); }
#userInput { flex: 1; padding: 12px 8px; resize: none; font-size: 15px; line-height: 1.5; max-height: 120px; min-height: 24px; color: var(--text); background: transparent; }
.input-actions { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
.action-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
.action-btn svg { width: 20px; height: 20px; }
.send-btn { background: #fff; color: #000; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; margin-left: 4px; transition: 0.2s; }
.send-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
.send-btn svg { width: 18px; height: 18px; margin-left: 2px; }

/* VOICE CALL UI */
.voice-overlay { position: fixed; inset: 0; background: #000; z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; padding-top: max(40px, env(safe-area-inset-top)); padding-bottom: max(40px, env(safe-area-inset-bottom)); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.voice-overlay.active { opacity: 1; pointer-events: auto; }
.voice-top { text-align: center; margin-top: 20px; }
.voice-timer { font-size: 18px; font-weight: 500; background: #1a1a1a; padding: 6px 16px; border-radius: 20px; display: inline-block; }
.voice-desc { color: var(--text-muted); font-size: 13px; margin-top: 12px; }
.voice-center { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; width: 100%; }
.orb { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb, #1e3a8a); box-shadow: 0 0 40px rgba(59, 130, 246, 0.4); transition: transform 0.1s; }
.orb.listening { animation: pulse-listening 1.5s infinite alternate; }
.orb.speaking { animation: pulse-speaking 0.8s infinite alternate; background: radial-gradient(circle at 30% 30%, #a78bfa, #8b5cf6, #5b21b6); box-shadow: 0 0 60px rgba(139, 92, 246, 0.6); }
@keyframes pulse-listening { 0% { transform: scale(1); box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); } 100% { transform: scale(1.1); box-shadow: 0 0 60px rgba(59, 130, 246, 0.7); } }
@keyframes pulse-speaking { 0% { transform: scale(1.05); box-shadow: 0 0 50px rgba(139, 92, 246, 0.5); } 100% { transform: scale(1.15); box-shadow: 0 0 80px rgba(139, 92, 246, 0.8); } }
.voice-status { font-size: 20px; font-weight: 600; margin-top: 40px; color: #e5e5e5; text-align: center; }
.voice-controls { display: flex; gap: 24px; align-items: center; justify-content: center; margin-bottom: 20px; }
.voice-btn { width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #1a1a1a; color: #fff; transition: 0.2s; }
.voice-btn.danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
.voice-btn svg { width: 28px; height: 28px; }

/* HIDDEN INPUTS */
#imageUpload { display: none; }

/* SIDEBAR & MODALS */
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--surface); z-index: 100; transform: translateX(-100%); transition: transform 0.3s; display: flex; flex-direction: column; }
.sidebar.open { transform: translateX(0); }
.sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 90; display: none; }
.sidebar-overlay.show { display: block; }
.sidebar-head { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.sidebar-list { flex: 1; overflow-y: auto; padding: 12px; }
.chat-item { padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; cursor: pointer; }
.chat-item:hover { background: var(--surface-hover); }
.chat-item-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.del-btn { color: var(--danger); opacity: 0; }
.chat-item:hover .del-btn { opacity: 1; }
.sidebar-foot { padding: 16px; border-top: 1px solid var(--border); }
.settings-btn { width: 100%; padding: 12px; background: var(--surface-hover); border-radius: 10px; font-weight: 500; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border-radius: 20px; width: 100%; max-width: 400px; }
.modal-head { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
.form-group input, .form-group select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); }
.modal-foot { padding: 20px; border-top: 1px solid var(--border); }
.btn { width: 100%; padding: 12px; border-radius: 10px; font-weight: 600; background: var(--primary); color: #fff; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: #fff; color: #000; padding: 12px 24px; border-radius: 30px; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 300; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <button class="icon-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="header-title"><span>❖</span> Sigan Ai</div>
    <div class="header-actions">
      <button class="icon-btn" id="callBtnHeader" title="Voice Call" style="color: var(--primary);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </button>
      <button class="icon-btn" id="newChatBtnHeader"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </header>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-logo">👻</div>
      <h2>Selamat Datang, Usman</h2>
      <p>Ada yang bisa saya bantu hari ini?</p>
    </div>
    <div class="messages" id="messages"></div>
  </div>

  <div class="input-wrapper">
    <div class="chips-container" id="chips">
      <button class="chip" data-prompt="Bantu saya membuat kode program / website untuk: "><span>💻</span> Pengembangan Web</button>
      <button class="chip" data-prompt="Buatkan kerangka presentasi (PPT) mengenai topik: "><span>📊</span> PPT</button>
      <button class="chip" data-prompt="Tolong terjemahkan teks berikut: "><span>🌐</span> Terjemahkan</button>
      <button class="chip" data-prompt="Tolong rangkum dokumen berikut: "><span>📄</span> Baca File</button>
      <button class="chip" data-prompt="Beri rekomendasi prompt foto produk untuk: "><span>📸</span> Foto Produk</button>
    </div>

    <div class="input-box">
      <textarea id="userInput" placeholder="Ketik pesan..." rows="1"></textarea>
      <div class="input-actions">
        <button class="action-btn" id="cameraBtn" title="Kirim Gambar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <button class="send-btn" id="sendBtn" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
      </div>

</div>

<input type="file" id="imageUpload" accept="image/*">

<div class="voice-overlay" id="voiceOverlay">
  <div class="voice-top">
    <div class="voice-timer" id="callTimer">00:00</div>
    <div class="voice-desc">Sigan Ai Live Call</div>
  </div>
  <div class="voice-center">
    <div class="orb" id="voiceOrb"></div>
    <div class="voice-status" id="voiceStatus">Menyambungkan...</div>
  </div>

</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head"><div class="brand">❖ Sigan Ai</div><button class="icon-btn" id="closeSidebar">×</button></div>
  <div class="sidebar-list" id="chatList"></div>
  <div class="sidebar-foot"><button class="settings-btn" id="settingsBtn">⚙️ Pengaturan</button></div>
</aside>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-head"><h3>⚙️ Pengaturan</h3><button class="icon-btn" id="closeSettings">×</button></div>
    <div class="modal-body">
      <div class="form-group">
        <label>Penyedia AI (Provider)</label>
        <select id="providerSelect">
          <option value="gemini">Google Gemini</option>
          <option value="groq">Groq - GPT OSS (Kuota Besar)</option>
        </select>
      </div>
      <div class="form-group">
        <label id="apiKeyLabel">API Key Gemini</label>
        <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
      </div>
      <div class="form-group">
        <label id="modelLabel">Model AI</label>
        <select id="modelSelect"></select>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" id="saveSettings">Simpan</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SIGAN AI v14.0 - Updated Groq Models (GPT-OSS)
   ============================================================ */

const LS_CHATS = 'sigan_chats_v4';
const LS_PROVIDER = 'sigan_provider';
const LS_GEMINI_KEY = 'sigan_gemini_key';
const LS_GEMINI_MODEL = 'sigan_gemini_model';
const LS_GROQ_KEY = 'sigan_groq_key';
const LS_GROQ_MODEL = 'sigan_groq_model';

const SYSTEM_PROMPT = `Anda adalah "Sigan Ai", asisten AI cerdas serba bisa yang dikembangkan oleh Usman Hasan.
Karakter: Ramah, cerdas, jujur, dan modern. Selalu jawab dengan format Markdown yang rapi.`;

const VOICE_PROMPT = `Anda Sigan Ai. Jawablah dengan SANGAT SINGKAT, maksimal 2 kalimat. Jangan gunakan markdown. Langsung jawab intinya saja seperti sedang menelepon.`;

const state = { chats: [], activeId: null, sending: false, imageBase64: null, provider: 'gemini' };
let callState = { active: false, timer: null, seconds: 0, isSpeaking: false, isProcessing: false };

const els = {};
['chatArea','messages','welcome','userInput','sendBtn','menuBtn','newChatBtnHeader','closeSidebar',
 'sidebar','sidebarOverlay','chatList','settingsBtn','settingsModal','closeSettings',
 'providerSelect','apiKeyLabel','apiKeyInput','modelLabel','modelSelect','saveSettings',
 'toast','chips','imageUpload','cameraBtn', 'callBtnHeader','voiceOverlay','voiceOrb','voiceStatus','callTimer','endCallBtn'
].forEach(id => els[id] = document.getElementById(id));

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const escapeHtml = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function renderMarkdown(text) {
  let s = escapeHtml(text);
  const codeBlocks = [];
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    const i = codeBlocks.length;
    codeBlocks.push(`<div class="code-container"><button class="copy-btn" onclick="copyCode(this)">Salin</button><pre><code>${code.replace(/\n$/, '')}</code></pre></div>`);
    return `\u0000CB${i}\u0000`;
  });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>');
  const lines = s.split('\n'); let inList = false, out = [];
  for (const line of lines) {
    const m = line.match(/^\s*[-*]\s+(.+)$/);
    if (m) { if (!inList) { out.push('<ul>'); inList = true; } out.push(`<li>${m[1]}</li>`); }
    else { if (inList) { out.push('</ul>'); inList = false; } out.push(line); }
  }
  if (inList) out.push('</ul>');
  s = out.join('\n').replace(/\n/g, '<br>').replace(/<br>\s*<ul>/g, '<ul>').replace(/<\/ul>\s*<br>/g, '</ul>').replace(/<br>\s*<li>/g, '<li>').replace(/<\/li>\s*<br>/g, '</li>');
  return s.replace(/\u0000CB(\d+)\u0000/g, (m, i) => codeBlocks[+i]);
}
window.copyCode = function(btn) {
  const code = btn.nextElementSibling.innerText;
  const success = () => { btn.textContent = 'Tersalin!'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = 'Salin'; btn.classList.remove('copied'); }, 2000); };
  if (navigator.clipboard) navigator.clipboard.writeText(code).then(success);
};
function showToast(msg, type = '') { els.toast.textContent = msg; els.toast.className = `toast show ${type}`; setTimeout(() => els.toast.classList.remove('show'), 3000); }

function loadChats() { try { state.chats = JSON.parse(localStorage.getItem(LS_CHATS)) || []; } catch { state.chats = []; } }
function saveChats() { localStorage.setItem(LS_CHATS, JSON.stringify(state.chats)); }
function getActiveChat() { return state.chats.find(c => c.id === state.activeId); }

function renderChatList() {
  if (!state.chats.length) { els.chatList.innerHTML = '<div style="color:#666;text-align:center;padding:20px;font-size:13px;">Belum ada chat.</div>'; return; }
  els.chatList.innerHTML = state.chats.map(c => `
    <div class="chat-item ${c.id === state.activeId ? 'active' : ''}" onclick="selectChat('${c.id}')">
      <div class="chat-item-title">${escapeHtml(c.title || 'Chat Baru')}</div>
      <button class="del-btn" onclick="event.stopPropagation(); deleteChat('${c.id}')">🗑</button>
    </div>
  `).join('');
}
window.selectChat = (id) => { state.activeId = id; renderChatList(); renderMessages(); closeSidebar(); };
window.deleteChat = (id) => {
  if(!confirm('Hapus chat ini?')) return;
  state.chats = state.chats.filter(c => c.id !== id);
  if (state.activeId === id) state.activeId = state.chats[0]?.id || null;
  saveChats(); renderChatList(); renderMessages();
};
function createNewChat() {
  const chat = { id: uid(), title: 'Chat Baru', messages: [], updatedAt: Date.now() };
  state.chats.unshift(chat); state.activeId = chat.id;
  saveChats(); renderChatList(); renderMessages(); closeSidebar();
}

function renderMessages() {
  const chat = getActiveChat();
  if (!chat || !chat.messages.length) { els.welcome.style.display = 'flex'; els.messages.innerHTML = ''; return; }
  els.welcome.style.display = 'none';
  els.messages.innerHTML = chat.messages.map(m => {
    if (m.role === 'user') {
      return `<div class="msg user">${m.image ? `<img src="${m.image}" style="max-width:200px;border-radius:12px;margin-bottom:8px;">` : ''}<div class="bubble">${escapeHtml(m.text)}</div></div>`;
    }
    if (m.role === 'error') return `<div class="msg model error"><div class="bubble">⚠️ ${escapeHtml(m.text)}</div></div>`;
    return `<div class="msg model"><div class="bubble">${renderMarkdown(m.text)}</div></div>`;
  }).join('');
  els.chatArea.scrollTop = els.chatArea.scrollHeight;
}

/* ============================================================
   SETTINGS & MODELS (UPDATED)
   ============================================================ */
const GEMINI_MODELS = [
  { id: 'gemini-flash-latest', name: 'Gemini Flash Latest (Sangat Cepat)' },
  { id: 'gemini-pro-latest', name: 'Gemini Pro Latest (Lebih Pintar)' }
];
// Groq telah menghapus Llama lama, kini memakai GPT-OSS
const GROQ_MODELS = [
  { id: 'openai/gpt-oss-120b', name: 'GPT-OSS 120B (Pintar)' },
  { id: 'openai/gpt-oss-20b', name: 'GPT-OSS 20B (Super Cepat)' }
];

function updateSettingsUI() {
  const p = els.providerSelect.value;
  els.apiKeyInput.value = p === 'gemini' ? (localStorage.getItem(LS_GEMINI_KEY)||'') : (localStorage.getItem(LS_GROQ_KEY)||'');
  
  if (p === 'gemini') {
    els.apiKeyLabel.textContent = 'API Key Gemini';
    els.apiKeyInput.placeholder = 'AIzaSy...';
    els.modelLabel.textContent = 'Model Gemini';
    els.modelSelect.innerHTML = GEMINI_MODELS.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
    els.modelSelect.value = localStorage.getItem(LS_GEMINI_MODEL) || 'gemini-flash-latest';
  } else {
    els.apiKeyLabel.textContent = 'API Key Groq (gsk_...)';
    els.apiKeyInput.placeholder = 'gsk_...';
    els.modelLabel.textContent = 'Model Groq';
    els.modelSelect.innerHTML = GROQ_MODELS.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
    els.modelSelect.value = localStorage.getItem(LS_GROQ_MODEL) || 'openai/gpt-oss-120b';
  }
}

els.providerSelect.onchange = updateSettingsUI;

window.openSettings = () => {
  els.providerSelect.value = state.provider;
  updateSettingsUI();
  els.settingsModal.classList.add('show');
};

els.saveSettings.onclick = () => {
  const p = els.providerSelect.value;
  const key = els.apiKeyInput.value.trim();
  const model = els.modelSelect.value;
  if (!key) { showToast('API Key tidak boleh kosong', 'error'); return; }
  
  localStorage.setItem(LS_PROVIDER, p);
  if (p === 'gemini') {
    localStorage.setItem(LS_GEMINI_KEY, key);
    localStorage.setItem(LS_GEMINI_MODEL, model);
  } else {
    localStorage.setItem(LS_GROQ_KEY, key);
    localStorage.setItem(LS_GROQ_MODEL, model);
  }
  
  state.provider = p;
  els.settingsModal.classList.remove('show');
  showToast(`Beralih ke ${p === 'gemini' ? 'Gemini' : 'Groq (GPT-OSS)'}`, 'success');
};

/* ============================================================
   API CALLS
   ============================================================ */
async function fetchWithRetry(url, options, maxRetries = 2) {
  let attempt = 0;
  while (attempt < maxRetries) {
    try {
      const response = await fetch(url, options);
      if (response.status === 429) {
        attempt++;
        if (attempt >= maxRetries) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error?.message || 'Kuota habis. Ganti provider atau tunggu.');
        }
        const waitTime = Math.pow(2, attempt) * 1000;
        showToast(`Rate limit. Mencoba lagi dalam ${waitTime/1000} detik...`);
        await new Promise(resolve => setTimeout(resolve, waitTime));
        continue;
      }
      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP Error: ${response.status}`);
      }
      return response;
    } catch (error) {
      if (attempt >= maxRetries - 1) throw error;
      attempt++;
      await new Promise(resolve => setTimeout(resolve, Math.pow(2, attempt) * 1000));
    }
  }
}

async function callGeminiStreaming(messages, onChunk) {
  const apiKey = localStorage.getItem(LS_GEMINI_KEY);
  const model = localStorage.getItem(LS_GEMINI_MODEL) || 'gemini-flash-latest';
  if (!apiKey) throw new Error('API Key Gemini belum diatur.');

  const contents = messages.map(m => {
    const parts = [{ text: m.text }];
    if (m.image) parts.push({ inlineData: { mimeType: "image/jpeg", data: m.image.split(',')[1] } });
    return { role: m.role === 'model' ? 'model' : 'user', parts };
  });

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${apiKey}`;
  const response = await fetchWithRetry(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents, systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] } })
  });

  const reader = response.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let fullText = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value, { stream: true });
    for (const line of chunk.split("\n")) {
      if (line.startsWith("data: ")) {
        const dataStr = line.slice(6);
        if (dataStr === "[DONE]") break;
        try {
          const data = JSON.parse(dataStr);
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
          if (text) { fullText += text; onChunk(fullText); }
        } catch (e) {}
      }
    }
  }
  return fullText;
}

async function callGroqStreaming(messages, onChunk) {
  const apiKey = localStorage.getItem(LS_GROQ_KEY);
  const model = localStorage.getItem(LS_GROQ_MODEL) || 'openai/gpt-oss-120b';
  if (!apiKey) throw new Error('API Key Groq belum diatur.');

  const chatMessages = [{ role: 'system', content: SYSTEM_PROMPT }, ...messages.map(m => ({ role: m.role === 'model' ? 'assistant' : 'user', content: m.text }))];

  const response = await fetchWithRetry('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({ model, messages: chatMessages, stream: true, temperature: 0.7 })
  });

  const reader = response.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let fullText = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    const chunk = decoder.decode(value, { stream: true });
    for (const line of chunk.split("\n")) {
      if (line.startsWith("data: ")) {
        const dataStr = line.slice(6);
        if (dataStr === "[DONE]") break;
        try {
          const data = JSON.parse(dataStr);
          const text = data.choices?.[0]?.delta?.content || "";
          if (text) { fullText += text; onChunk(fullText); }
        } catch (e) {}
      }
    }
  }
  return fullText;
}

async function callGeminiTextVoice(userText) {
  const apiKey = localStorage.getItem(LS_GEMINI_KEY);
  const model = localStorage.getItem(LS_GEMINI_MODEL) || 'gemini-flash-latest';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  const response = await fetchWithRetry(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ 
      contents: [{ role: 'user', parts: [{ text: userText }] }], 
      systemInstruction: { parts: [{ text: VOICE_PROMPT }] },
      generationConfig: { maxOutputTokens: 100 }
    })
  });
  const data = await response.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || "Oke.";
}

async function callGroqTextVoice(userText) {
  const apiKey = localStorage.getItem(LS_GROQ_KEY);
  const model = localStorage.getItem(LS_GROQ_MODEL) || 'openai/gpt-oss-120b';
  const response = await fetchWithRetry('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({ 
      model, 
      messages: [{ role: 'system', content: VOICE_PROMPT }, { role: 'user', content: userText }],
      max_tokens: 100
    })
  });
  const data = await response.json();
  return data.choices?.[0]?.message?.content || "Oke.";
}

async function callAIStreaming(messages, onChunk) {
  if (state.provider === 'gemini') return callGeminiStreaming(messages, onChunk);
  return callGroqStreaming(messages, onChunk);
}
async function callAITextVoice(userText) {
  if (state.provider === 'gemini') return callGeminiTextVoice(userText);
  return callGroqTextVoice(userText);
}

/* ============================================================
   SEND MESSAGE (TEKS)
   ============================================================ */
async function sendMessage() {
  const text = els.userInput.value.trim();
  if ((!text && !state.imageBase64) || state.sending) return;

  if (!state.activeId) createNewChat();
  const chat = getActiveChat();
  const imgToSend = state.imageBase64;

  chat.messages.push({ role: 'user', text, image: imgToSend, ts: Date.now() });
  if (chat.title === 'Chat Baru' && text) chat.title = text.slice(0, 30) + '...';
  saveChats();

  els.userInput.value = ''; els.userInput.style.height = 'auto';
  state.imageBase64 = null; els.imageUpload.value = '';
  els.sendBtn.disabled = true; renderMessages(); renderChatList();

  state.sending = true; els.welcome.style.display = 'none';
  
  els.messages.innerHTML += `<div class="msg model" id="thinking-indicator"><div class="bubble typing"><span></span><span></span><span></span></div></div>`;
  els.chatArea.scrollTop = els.chatArea.scrollHeight;

  try {
    let fullReply = "";
    await callAIStreaming(chat.messages, (currentText) => {
      fullReply = currentText;
      const indicator = document.getElementById('thinking-indicator');
      if (indicator) indicator.remove();
      let replyBubble = document.getElementById('streaming-bubble');
      if (!replyBubble) {
        els.messages.innerHTML += `<div class="msg model" id="streaming-bubble"><div class="bubble"></div></div>`;
        replyBubble = document.getElementById('streaming-bubble');
      }
      replyBubble.querySelector('.bubble').innerHTML = renderMarkdown(currentText);
      els.chatArea.scrollTop = els.chatArea.scrollHeight;
    });
    chat.messages.push({ role: 'model', text: fullReply, ts: Date.now() });
  } catch (e) {
    const indicator = document.getElementById('thinking-indicator');
    if (indicator) indicator.remove();
    chat.messages.push({ role: 'error', text: e.message, ts: Date.now() });
  } finally {
    state.sending = false; saveChats(); renderMessages(); updateSendBtn();
  }
}

function updateSendBtn() {
  els.sendBtn.disabled = (!els.userInput.value.trim() && !state.imageBase64) || state.sending;
}

/* ============================================================
   VOICE CALL LOGIC
   ============================================================ */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;
let synth = window.speechSynthesis;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'id-ID'; recognition.interimResults = false; recognition.continuous = false;

  recognition.onstart = () => {
    if (!callState.active || callState.isSpeaking) return;
    els.voiceOrb.className = 'orb listening';
    els.voiceStatus.textContent = 'Mendengarkan...';
  };

  recognition.onresult = async (e) => {
    if (callState.isSpeaking || callState.isProcessing) return;
    const transcript = e.results[0][0].transcript;
    if (!transcript || transcript.trim().length < 2) return; 

    callState.isProcessing = true;
    els.voiceOrb.className = 'orb'; els.voiceStatus.textContent = 'Memproses...';
    recognition.abort();

    try {
      const reply = await callAITextVoice(transcript);
      speakText(reply);
    } catch (err) {
      els.voiceStatus.textContent = 'Error jaringan.';
      callState.isProcessing = false;
      setTimeout(() => { if(callState.active) startListening(); }, 2000);
    }
  };

  recognition.onend = () => {
    if (callState.active && !callState.isSpeaking && !callState.isProcessing) {
      setTimeout(() => { if(callState.active) startListening(); }, 300);
    }
  };
}

function speakText(text) {
  if (!callState.active) return;
  synth.cancel(); if(recognition) recognition.abort(); 
  const cleanText = text.replace(/[*#_`~]/g, '');
  const utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = 'id-ID'; utterance.rate = 1.05;
  utterance.onstart = () => { callState.isSpeaking = true; els.voiceOrb.className = 'orb speaking'; els.voiceStatus.textContent = 'Berbicara...'; };
  utterance.onend = () => {
    callState.isSpeaking = false; callState.isProcessing = false;
    setTimeout(() => { if (callState.active && !callState.isSpeaking) startListening(); }, 500);
  };
  synth.speak(utterance);
}

function startListening() {
  if (!callState.active || callState.isSpeaking || callState.isProcessing) return;
  try { recognition.start(); } catch (e) {} 
}

function startCall() {
  if (!SpeechRecognition || !synth) { showToast('Browser tidak mendukung fitur suara.', 'error'); return; }
  els.voiceOverlay.classList.add('active');
  callState.active = true; callState.seconds = 0; callState.isSpeaking = false; callState.isProcessing = false;
  els.voiceStatus.textContent = 'Menyambungkan...'; els.voiceOrb.className = 'orb';
  clearInterval(callState.timer);
  callState.timer = setInterval(() => {
    callState.seconds++;
    const m = String(Math.floor(callState.seconds / 60)).padStart(2, '0');
    const s = String(callState.seconds % 60).padStart(2, '0');
    els.callTimer.textContent = `${m}:${s}`;
  }, 1000);
  setTimeout(() => { speakText("Halo, ada yang bisa saya bantu?"); }, 500);
}

function endCall() {
  callState.active = false; clearInterval(callState.timer); synth.cancel(); if(recognition) recognition.abort();
  els.voiceOverlay.classList.remove('active'); els.callTimer.textContent = '00:00';
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */
els.sendBtn.onclick = sendMessage;
els.userInput.oninput = () => { els.userInput.style.height = 'auto'; els.userInput.style.height = (els.userInput.scrollHeight) + 'px'; updateSendBtn(); };
els.userInput.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } };

els.callBtnHeader.onclick = startCall;
els.endCallBtn.onclick = endCall;
els.newChatBtnHeader.onclick = createNewChat;
els.menuBtn.onclick = () => { els.sidebar.classList.add('open'); els.sidebarOverlay.classList.add('show'); };
window.closeSidebar = () => { els.sidebar.classList.remove('open'); els.sidebarOverlay.classList.remove('show'); };
els.closeSidebar.onclick = closeSidebar; els.sidebarOverlay.onclick = closeSidebar;

els.chips.onclick = (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  els.userInput.value = chip.dataset.prompt;
  els.userInput.focus();
  updateSendBtn();
  els.userInput.setSelectionRange(els.userInput.value.length, els.userInput.value.length);
  els.userInput.style.height = 'auto'; els.userInput.style.height = (els.userInput.scrollHeight) + 'px';
};

els.cameraBtn.onclick = () => els.imageUpload.click();
els.imageUpload.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    state.imageBase64 = ev.target.result;
    updateSendBtn();
    showToast('Gambar siap dikirim.', 'success');
    if (!els.userInput.value) els.userInput.value = "Tolong analisis gambar ini.";
  };
  reader.readAsDataURL(file);
};

els.settingsBtn.onclick = openSettings;
els.closeSettings.onclick = () => els.settingsModal.classList.remove('show');

/* ============================================================
   INIT
   ============================================================ */
state.provider = localStorage.getItem(LS_PROVIDER) || 'gemini';
loadChats();
if (state.chats.length > 0) { state.activeId = state.chats[0].id; renderMessages(); }
renderChatList();

if (!localStorage.getItem(LS_GEMINI_KEY) && !localStorage.getItem(LS_GROQ_KEY)) {
  setTimeout(openSettings, 500);
}
</script>
